## State Transitions

### Linear Flow (Main Path)

```
START
  ↓
InputValidator (1)
  ↓
SessionLoad (2)
  ↓
┌─────────────────────┐
│ ImageQualityGate (3)│ ← Conditional on input_type
└─────────────────────┘
  ↓ (if image clear)
VisionExtract (4)
  ↓
ClinicalExtractor (5)
  ↓
RedFlagDetector (6)
  ↓
TriageClassifier (7)
  ↓
TriageMerger (8)
  ↓
ClarificationGenerator (9)
  ↓
SessionSave (10)
  ↓
┌─────────────────────┐
│ EvidenceRouter (11)  │ ← Conditional: EMERGENCY skips evidence
└─────────────────────┘
  ↓ (if not EMERGENCY)
NCBIQueryBuilder (12)
  ↓
NCBIRetrieverTool (13)
  ↓
DomainClassifier (14)
  ↓
Navigator (15)
  ↓
WeatherFetcher (16)
  ↓
ReasoningVerifier (17)
  ↓
FinalStatusRouter (18)
  ↓
END
```

### Conditional Routing Logic

#### Route 1: Image Quality (Node 3)
```python
def route_by_image_quality(state: TriageState) -> str:
    if state.get("image_is_clear"):
        return "vision_extract"  # Continue to Node 4
    else:
        return "clarify_ask"  # Skip to clarify (Node 19)
```

#### Route 2: Clarification (Node 9)
```python
def route_by_clarification_need(state: TriageState) -> str:
    if state.get("need_clarify") and state.get("turn_count", 0) < 2:
        return "clarify_ask"  # Ask questions (Node 19)
    else:
        return "session_save"  # Continue to Node 10
```

#### Route 3: Emergency Bypass (Node 11)
```python
def route_by_urgency(state: TriageState) -> str:
    if state.get("triage_level") == "EMERGENCY":
        return "navigation"  # Skip evidence (Node 15)
    elif state.get("evidence_needed"):
        return "evidence"  # Retrieve evidence (Node 12)
    else:
        return "navigation"  # Skip evidence (Node 15)
```

#### Route 4: Final Status (Node 18)
```python
def route_by_status(state: TriageState) -> str:
    if state.get("status") == "error":
        return END
    elif state.get("status") == "need_more_info":
        return END
    else:  # status == "final"
        return END
```

