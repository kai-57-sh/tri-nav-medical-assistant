## Graph Compilation

```python
from langgraph.graph import StateGraph, START, END
from langgraph.checkpoint.redis import AsyncRedisSaver

# Create builder
builder = StateGraph(TriageState)

# Add all 18 nodes
for node_name, node_func in ALL_NODES:
    builder.add_node(node_name, node_func)

# Add edges
builder.add_edge(START, "InputValidator")
builder.add_edge("InputValidator", "SessionLoad")
# ... (all linear edges)

# Add conditional edges
builder.add_conditional_edges("ImageQualityGate", route_by_image_quality, {
    "vision_extract": "VisionExtract",
    "clarify_ask": "ClarifyAsk"
})
# ... (all conditional edges)

# Compile with Redis checkpointer
checkpointer = AsyncRedisSaver.from_conn_string(redis_url)
graph = builder.compile(checkpointer=checkpointer)
```

