## State Persistence Strategy

### Stored in Redis (60-minute TTL)

```python
minimal_state = {
    "session_id": state["session_id"],
    "turn_count": state["turn_count"],
    "symptom_schema": state["symptom_schema"],
    "clarify_questions": state["clarify_questions"],
    "triage_level": state["triage_level"],
    "case_domain": state["case_domain"],
    "evidence_cache_key": state.get("evidence_cache_key"),
    "navigation_cache_key": state.get("navigation_cache_key")
}
```

### NOT Stored (Privacy Constraints)

- `text` - Raw user input (CT-008)
- `image_base64` - Raw image data (CT-007)
- `visual_findings` - Intermediate data (derived from symptom_schema)
- `red_flags_hit` - Audit trail only (logged separately per FR-066)
- `candidate_evidence` - Large object (use cache_key instead)
- `hospitals` - Large object (use cache_key instead)
- `messages` - Full conversation history (not needed per CT-008)

---

## Error State Transitions

### Node-Level Errors

When any node fails:
1. **Log error** with correlation_id (FR-062)
2. **Set** `error_message` with details
3. **Set** `status` based on triage_level:
   - If `triage_level == "EMERGENCY"`: `status = "error"` (fail-fast for safety)
   - Else: `status = "final"` (degrade gracefully per FR-046, FR-048)
4. **Continue** to next node (no workflow interruption)

### External Service Failures

- **Amap fails**: Set `hospitals = []`, continue to ReasoningVerifier
- **Weather fails**: Set `weather_alert = None`, continue
- **NCBI fails**: Set `evidence_selected = []`, continue
- **Redis fails**: Treat as new session (turn_count = 1)

---

## Validation Rules

### Input Validation (Node 1)

- `text`: Max 2000 characters (FR-001)
- `image_base64`: Max 4MB after compression (FR-002)
- `lat`: -90 to 90 (valid latitude)
- `lng`: -180 to 180 (valid longitude)

### State Validation

- `turn_count`: 1 to 2 (CT-009)
- `triage_level`: EMERGENCY | URGENT | ROUTINE | SELF_CARE
- `case_domain`: dermatology | trauma | respiratory | gastro | neuro | urology | other
- `status`: need_more_info | final | error

